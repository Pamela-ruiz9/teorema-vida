<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { width:1080px; height:1080px; background:#0a0a0a; color:#f0ece4; font-family:'Inter',sans-serif; overflow:hidden; }
        .post { width:1080px; height:1080px; padding:50px 60px; display:flex; flex-direction:column; }
        .eyebrow { font-size:20px; letter-spacing:4px; text-transform:uppercase; color:#c4a35a; margin-bottom:15px; text-align:center; }
        .title { font-family:'Cormorant Garamond',Georgia,serif; font-size:64px; font-weight:300; line-height:1.15; text-align:center; margin-bottom:8px; }
        .subtitle { font-size:26px; color:#888; text-align:center; margin-bottom:25px; }
        .gold { color:#c4a35a; }
        .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin:20px 0; }
        .stat { text-align:center; padding:25px 15px; border:1px solid rgba(220,20,60,0.2); border-radius:10px; }
        .stat-num { font-family:'Cormorant Garamond',serif; font-size:60px; font-weight:600; color:#dc143c; line-height:1; }
        .stat-label { font-size:20px; color:#888; margin-top:10px; line-height:1.3; }
        .chart-area { flex:1; display:flex; align-items:center; justify-content:center; }
        .quote { text-align:center; padding:20px 30px; border-top:1px solid rgba(196,163,90,0.2); margin-top:auto; }
        .quote-text { font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:38px; color:#c4a35a; line-height:1.35; }
        .footer { display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:15px; border-top:1px solid rgba(255,255,255,0.05); }
        .source { font-size:18px; color:#555; }
        .brand { font-size:20px; color:#c4a35a; font-weight:500; }
    </style>
</head>
<body>
<div class="post">
    <div class="eyebrow">La Vida que nos Tocó</div>
    <div class="title">México: <span class="gold">#1 mundial</span><br>en horas trabajadas</div>
    <div class="subtitle">Y la salud mental lo paga</div>
    <div class="stats">
        <div class="stat"><div class="stat-num">2,128</div><div class="stat-label">hrs/año<br>OECD #1</div></div>
        <div class="stat"><div class="stat-num">399K</div><div class="stat-label">consultas<br>depresión 2024</div></div>
        <div class="stat"><div class="stat-num">6.8</div><div class="stat-label">suicidios/100K<br>jóvenes 2024</div></div>
    </div>
    <div class="chart-area">
        <canvas id="chart" width="950" height="280"></canvas>
    </div>
    <div class="quote">
        <div class="quote-text">"Ves todo. Puedes cambiar poco.<br>Eso pesa."</div>
    </div>
    <div class="footer">
        <div class="source">Fuentes: OECD 2023 · INEGI · CONASAMA</div>
        <div class="brand">La Vida que nos Tocó — Pame Ruiz</div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
Chart.defaults.color = '#888';
Chart.defaults.font.size = 16;
new Chart(document.getElementById('chart').getContext('2d'), {
    type:'bar', data:{labels:['00','05','10','15','18','20','23','24'],
    datasets:[{data:[3.5,4.2,5.1,5.8,6.5,7.4,6.8,6.8],backgroundColor:'rgba(220,60,60,0.6)',borderColor:'#dc3c3c',borderWidth:1,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,
    scales:{y:{beginAtZero:true,max:9,grid:{color:'rgba(255,255,255,0.05)'},ticks:{font:{size:16}},title:{display:true,text:'suicidios/100K (15-29)',font:{size:16}}},
    x:{grid:{display:false},ticks:{font:{size:15}}}},
    plugins:{legend:{display:false}}}
});
</script>
</body></html>
