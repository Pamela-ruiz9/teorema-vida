<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { width:1080px; height:1080px; background:#0a0a0a; color:#f0ece4; font-family:'Inter',sans-serif; overflow:hidden; }
        .post { width:1080px; height:1080px; padding:60px; display:flex; flex-direction:column; justify-content:space-between; }
        .header { text-align:center; }
        .eyebrow { font-size:14px; letter-spacing:3px; text-transform:uppercase; color:#c4a35a; margin-bottom:12px; }
        .title { font-family:'Cormorant Garamond',Georgia,serif; font-size:38px; font-weight:300; line-height:1.2; margin-bottom:8px; }
        .subtitle { font-size:18px; color:#888; }
        .gold { color:#c4a35a; }
        .chart-area { flex:1; display:flex; align-items:center; justify-content:center; padding:10px 0; }
        .insight { text-align:center; padding:20px 40px; border-top:1px solid rgba(196,163,90,0.2); }
        .insight-text { font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:22px; color:#c4a35a; line-height:1.4; }
        .footer { display:flex; justify-content:space-between; align-items:center; padding-top:15px; border-top:1px solid rgba(255,255,255,0.05); }
        .source { font-size:11px; color:#555; }
        .brand { font-size:13px; color:#c4a35a; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<!-- POST 4: SALUD MENTAL + P -->
<div class="post">
    <div class="header">
        <div class="eyebrow">La Vida que nos Tocó</div>
        <div class="title">México: <span class="gold">#1 mundial</span><br>en horas trabajadas</div>
        <div class="subtitle">Y la salud mental lo paga</div>
    </div>
    <div class="chart-area">
        <canvas id="chart4" width="900" height="380"></canvas>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:15px; padding:10px 0; text-align:center;">
        <div style="padding:15px; border:1px solid rgba(220,20,60,0.2); border-radius:8px;">
            <div style="font-family:'Cormorant Garamond',serif; font-size:32px; color:#dc143c;">2,128</div>
            <div style="font-size:11px; color:#888;">hrs/año trabajadas<br>OECD #1</div>
        </div>
        <div style="padding:15px; border:1px solid rgba(220,20,60,0.2); border-radius:8px;">
            <div style="font-family:'Cormorant Garamond',serif; font-size:32px; color:#dc143c;">399K</div>
            <div style="font-size:11px; color:#888;">consultas depresión<br>2024</div>
        </div>
        <div style="padding:15px; border:1px solid rgba(220,20,60,0.2); border-radius:8px;">
            <div style="font-family:'Cormorant Garamond',serif; font-size:32px; color:#dc143c;">6.8</div>
            <div style="font-size:11px; color:#888;">suicidios/100K<br>jóvenes 2024</div>
        </div>
    </div>
    <div class="insight">
        <div class="insight-text">"Ves todo. Puedes cambiar poco. Eso pesa."</div>
    </div>
    <div class="footer">
        <div class="source">Fuentes: OECD 2023 · INEGI 2024 · CONASAMA · Gob.mx</div>
        <div class="brand">lavidaquenostoco.mx</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
new Chart(document.getElementById('chart4').getContext('2d'), {
    type: 'bar',
    data: {
        labels: ['2000','2005','2010','2015','2018','2020','2023','2024'],
        datasets: [{
            label: 'Suicidios 15-29 /100K',
            data: [3.5, 4.2, 5.1, 5.8, 6.5, 7.4, 6.8, 6.8],
            backgroundColor: 'rgba(220,60,60,0.6)',
            borderColor: '#dc3c3c',
            borderWidth: 1, borderRadius: 4
        }]
    },
    options: {
        responsive:true, maintainAspectRatio:false,
        scales: {
            y: { beginAtZero:true, max:9, grid:{color:'rgba(255,255,255,0.05)'}, ticks:{color:'#888', font:{size:13}} },
            x: { grid:{display:false}, ticks:{color:'#888', font:{size:12}} }
        },
        plugins: { legend:{display:false} }
    }
});
</script>
</body>
</html>
