<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { width:1080px; height:1080px; background:#0a0a0a; color:#f0ece4; font-family:'Inter',sans-serif; overflow:hidden; }
        .post { width:1080px; height:1080px; padding:50px 60px; display:flex; flex-direction:column; }
        .eyebrow { font-size:20px; letter-spacing:4px; text-transform:uppercase; color:#c4a35a; margin-bottom:15px; text-align:center; }
        .title { font-family:'Cormorant Garamond',Georgia,serif; font-size:68px; font-weight:300; line-height:1.15; text-align:center; margin-bottom:8px; }
        .subtitle { font-size:26px; color:#888; text-align:center; margin-bottom:25px; }
        .gold { color:#c4a35a; }
        .chart-area { flex:1; display:flex; align-items:center; justify-content:center; }
        .legend { display:flex; gap:30px; justify-content:center; margin-bottom:10px; font-size:20px; }
        .legend-item { display:flex; align-items:center; gap:8px; }
        .legend-dot { width:14px; height:14px; border-radius:50%; }
        .quote { text-align:center; padding:25px 30px; border-top:1px solid rgba(196,163,90,0.2); margin-top:auto; }
        .quote-text { font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:36px; color:#c4a35a; line-height:1.35; }
        .footer { display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:15px; border-top:1px solid rgba(255,255,255,0.05); }
        .source { font-size:18px; color:#555; }
        .brand { font-size:20px; color:#c4a35a; font-weight:500; }
    </style>
</head>
<body>
<div class="post">
    <div class="eyebrow">La Vida que nos Tocó</div>
    <div class="title">La confianza que<br><span class="gold">nunca tuvimos</span></div>
    <div class="subtitle">% confianza en gobierno · EE.UU. vs México</div>
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4169e1;"></div><span style="color:#888;">EE.UU.</span></div>
        <div class="legend-item"><div class="legend-dot" style="background:#c4a35a;"></div><span style="color:#888;">México</span></div>
    </div>
    <div class="chart-area">
        <canvas id="chart" width="950" height="420"></canvas>
    </div>
    <div class="quote">
        <div class="quote-text">"Perder algo que tenías duele diferente<br>a nunca haberlo tenido."</div>
    </div>
    <div class="footer">
        <div class="source">Fuente: Pew Research · Latinobarómetro</div>
        <div class="brand">La Vida que nos Tocó — Pame Ruiz</div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
Chart.defaults.color = '#888';
Chart.defaults.font.size = 18;
Chart.defaults.font.family = 'Inter';
new Chart(document.getElementById('chart').getContext('2d'), {
    type:'line', data:{ labels:['1960','1970','1980','1990','2000','2010','2020','2025'],
    datasets:[
        {label:'EE.UU.', data:[73,54,25,35,42,22,20,22], borderColor:'#4169e1', backgroundColor:'rgba(65,105,225,0.08)', tension:0.3, fill:true, borderWidth:3, pointRadius:7, pointBackgroundColor:'#4169e1'},
        {label:'México', data:[null,null,null,30,35,28,25,28], borderColor:'#c4a35a', backgroundColor:'rgba(196,163,90,0.08)', tension:0.3, fill:true, borderWidth:3, pointRadius:7, pointBackgroundColor:'#c4a35a'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
    scales:{y:{beginAtZero:true,max:80,grid:{color:'rgba(255,255,255,0.05)'},ticks:{font:{size:18},callback:v=>v+'%'}},
    x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{font:{size:17}}}},
    plugins:{legend:{display:false}}}
});
</script>
</body></html>
