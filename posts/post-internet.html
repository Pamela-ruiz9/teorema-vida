<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { width:1080px; height:1080px; background:#0a0a0a; color:#f0ece4; font-family:'Inter',sans-serif; overflow:hidden; }
        .post { width:1080px; height:1080px; padding:50px 60px; display:flex; flex-direction:column; }
        .eyebrow { font-size:20px; letter-spacing:4px; text-transform:uppercase; color:#c4a35a; margin-bottom:15px; text-align:center; }
        .title { font-family:'Cormorant Garamond',Georgia,serif; font-size:68px; font-weight:300; line-height:1.15; text-align:center; margin-bottom:8px; }
        .subtitle { font-size:28px; color:#888; text-align:center; margin-bottom:30px; }
        .gold { color:#c4a35a; }
        .chart-area { flex:1; display:flex; align-items:center; justify-content:center; }
        .quote { text-align:center; padding:25px 30px; border-top:1px solid rgba(196,163,90,0.2); margin-top:auto; }
        .quote-text { font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:36px; color:#c4a35a; line-height:1.35; }
        .footer { display:flex; justify-content:space-between; align-items:center; padding-top:12px; margin-top:15px; border-top:1px solid rgba(255,255,255,0.05); }
        .source { font-size:18px; color:#555; }
        .brand { font-size:20px; color:#c4a35a; font-weight:500; }
    </style>
</head>
<body>
<div class="post">
    <div class="eyebrow">La Vida que nos Tocó</div>
    <div class="title">De <span class="gold">0%</span> a <span class="gold">83%</span><br>en 30 años</div>
    <div class="subtitle">Internet en México · 1995-2025</div>
    <div class="chart-area">
        <canvas id="chart" width="950" height="420"></canvas>
    </div>
    <div class="quote">
        <div class="quote-text">"La Gen Z no conoce un mundo sin pantalla.<br>La del Milagro no conoció uno con ella."</div>
    </div>
    <div class="footer">
        <div class="source">Fuente: INEGI / ENDUTIH 2024 · 100.2M usuarios</div>
        <div class="brand">La Vida que nos Tocó — Pame Ruiz</div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
Chart.defaults.color = '#888';
Chart.defaults.font.size = 16;
Chart.defaults.font.family = 'Inter';
new Chart(document.getElementById('chart').getContext('2d'), {
    type:'line', data:{ labels:['1995','2000','2005','2010','2015','2020','2024','2025'],
    datasets:[{data:[1,5,18,34,57,72,83,85], borderColor:'#c4a35a', backgroundColor:'rgba(196,163,90,0.15)',
    tension:0.4, fill:true, borderWidth:3, pointBackgroundColor:'#c4a35a', pointRadius:7}]},
    options:{responsive:true,maintainAspectRatio:false,
    scales:{y:{beginAtZero:true,max:100,grid:{color:'rgba(255,255,255,0.05)'},ticks:{font:{size:18},callback:v=>v+'%'}},
    x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{font:{size:17}}}},
    plugins:{legend:{display:false}}}
});
</script>
</body></html>
